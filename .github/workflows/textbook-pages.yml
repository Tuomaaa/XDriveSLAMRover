name: Engineering Notes Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/textbook/**"
      - ".github/workflows/textbook-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/textbook/**"
      - ".github/workflows/textbook-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textbook-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/textbook/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/textbook/requirements.txt

      - name: Build engineering notes with warnings as errors
        run: >-
          sphinx-build -W --keep-going -b html
          docs/textbook build/textbook

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/textbook

  # Repository Settings -> Pages must use GitHub Actions before the first deploy.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
