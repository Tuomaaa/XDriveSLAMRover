<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title description">
  <title id="title">SummerSLAM system architecture</title>
  <desc id="description">A block diagram connecting the operator, Raspberry Pi ROS 2 computer, CAN bus, STM32 firmware, drive base, encoders, and ultrasonic sensors.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .label { font: 600 17px Arial, sans-serif; fill: #17202a; }
      .small { font: 14px Arial, sans-serif; fill: #3f4b59; }
      .group { font: 700 14px Arial, sans-serif; fill: #52606d; }
      .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #2f855a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="500" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="52" y="42" class="group">OPERATOR AND COMPUTE</text>
  <text x="375" y="42" class="group">TRANSPORT AND FIRMWARE</text>
  <text x="710" y="42" class="group">ROVER HARDWARE</text>

  <rect x="48" y="78" width="230" height="82" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="163" y="112" text-anchor="middle" class="label">PS2 Controller</text>
  <text x="163" y="138" text-anchor="middle" class="small">GPIO bit-bang input</text>

  <rect x="48" y="224" width="230" height="132" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="163" y="260" text-anchor="middle" class="label">Raspberry Pi 4B</text>
  <text x="163" y="288" text-anchor="middle" class="small">ROS 2 Jazzy</text>
  <text x="163" y="314" text-anchor="middle" class="small">odometry | sensor model | MCL</text>
  <text x="163" y="338" text-anchor="middle" class="small">MCP2515 CAN HAT</text>

  <rect x="370" y="224" width="220" height="90" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="480" y="260" text-anchor="middle" class="label">CAN Bus</text>
  <text x="480" y="288" text-anchor="middle" class="small">500 kbit/s | 11-bit IDs</text>

  <rect x="370" y="78" width="220" height="94" rx="6" fill="#ecfdf5" stroke="#16855b" stroke-width="2"/>
  <text x="480" y="114" text-anchor="middle" class="label">STM32F411</text>
  <text x="480" y="142" text-anchor="middle" class="small">control | encoder capture | safety</text>

  <rect x="700" y="68" width="210" height="90" rx="6" fill="#fef2f2" stroke="#c24141" stroke-width="2"/>
  <text x="805" y="104" text-anchor="middle" class="label">X-Drive Base</text>
  <text x="805" y="132" text-anchor="middle" class="small">4 motors | 4 omni wheels</text>

  <rect x="700" y="210" width="210" height="82" rx="6" fill="#f0fdf4" stroke="#2f855a" stroke-width="2"/>
  <text x="805" y="244" text-anchor="middle" class="label">Quadrature Encoders</text>
  <text x="805" y="270" text-anchor="middle" class="small">calibrated 2779 CPR</text>

  <rect x="700" y="352" width="210" height="82" rx="6" fill="#fff7ed" stroke="#c58a18" stroke-width="2"/>
  <text x="805" y="386" text-anchor="middle" class="label">Ultrasonic Sensors</text>
  <text x="805" y="412" text-anchor="middle" class="small">right + back HC-SR04</text>

  <path d="M 163 160 L 163 214" class="line"/>
  <path d="M 278 269 L 360 269" class="line"/>
  <path d="M 480 214 L 480 182" class="line"/>
  <path d="M 590 125 L 690 112" class="line"/>
  <path d="M 700 251 L 602 157" class="feedback"/>
  <path d="M 700 393 L 600 166" class="feedback"/>
  <path d="M 370 287 L 288 287" class="feedback"/>

  <text x="624" y="96" class="small">PWM + direction</text>
  <text x="610" y="237" class="small">ticks</text>
  <text x="615" y="350" class="small">range</text>
  <text x="306" y="251" class="small">commands</text>
  <text x="302" y="310" class="small">telemetry</text>
</svg>
